services:
  postgres:
    # TimescaleDB ships with PostgreSQL 16; if you deploy to a Postgres
    # that doesn't support the timescaledb extension (e.g. Neon), the
    # migrations gracefully fall back to plain tables — see
    # apps/api/migrations/0005_progress.up.sql.
    image: timescale/timescaledb:latest-pg16
    container_name: osama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: osama
      POSTGRES_PASSWORD: osama
      POSTGRES_DB: osama
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osama -d osama"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: osama_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
