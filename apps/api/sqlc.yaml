version: "2"
sql:
  - engine: postgresql
    queries: internal/db/queries
    schema:
      - migrations/0001_init.up.sql
      - migrations/0002_clients.up.sql
      - migrations/0003_workouts.up.sql
      - migrations/0004_nutrition.up.sql
      - migrations/0005_progress.up.sql
      - migrations/0006_checkin_messages.up.sql
      - migrations/0007_cms.up.sql
    gen:
      go:
        package: db
        out: internal/db/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_exact_table_names: false
        emit_empty_slices: true
        output_db_file_name: db.go
        output_models_file_name: models.go
        output_querier_file_name: querier.go
